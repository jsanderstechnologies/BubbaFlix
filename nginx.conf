server {
    listen 80;
    server_name localhost;

    # Configure Nginx logs
    access_log /var/log/nginx/access.log;
    access_log /dev/stdout;
    error_log /var/log/nginx/error.log warn;
    error_log /dev/stderr warn;

    # Resolvers for proxying upstream HTTPS hosts in Docker Nginx (Force IPv4 only)
    resolver 1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend server global settings store & health check
    location /api/settings {
        proxy_pass http://127.0.0.1:5000/api/settings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/transcode/health {
        proxy_pass http://127.0.0.1:5000/api/transcode/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Proxy FFmpeg / VLC real-time video & audio stream transcoder
    location /api/transcode {
        proxy_pass http://127.0.0.1:5000/api/transcode;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # Proxy SIMKL API requests through Nginx (logs in Portainer & bypasses CORS)
    location /api/simkl/ {
        proxy_pass https://api.simkl.com/;
        proxy_set_header Host api.simkl.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "BubbaFlix/1.0 (Smart TV Media App)";
        proxy_set_header simkl-api-key $http_simkl_api_key;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_ssl_name api.simkl.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy Groq AI requests through Nginx (logs requests in Portainer & bypasses CORS)
    location /api/groq/ {
        proxy_pass https://api.groq.com/openai/v1/;
        proxy_set_header Host api.groq.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_name api.groq.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
