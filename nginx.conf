server {
    listen 80;
    server_name localhost;

    # Resolvers for dynamic runtime DNS lookup in Docker Nginx (including Docker 127.0.0.11 daemon)
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend server global settings store & health check
    location /api/settings {
        proxy_pass http://127.0.0.1:5000/api/settings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/transcode/health {
        proxy_pass http://127.0.0.1:5000/api/transcode/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Proxy SolidTorrents API requests through Nginx (dynamic runtime DNS)
    location ~ ^/api/solidtorrents/(.*)$ {
        set $solidtorrents_url "https://solidtorrents.to/api/v1/$1";
        proxy_pass $solidtorrents_url;
        proxy_set_header Host solidtorrents.to;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_name solidtorrents.to;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy SIMKL API requests through Nginx (logs in Portainer & bypasses CORS)
    location ~ ^/api/simkl/(.*)$ {
        set $simkl_url "https://api.simkl.com/$1";
        proxy_pass $simkl_url;
        proxy_set_header Host api.simkl.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "BubbaFlix/1.0 (Smart TV Media App)";
        proxy_ssl_name api.simkl.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy Premiumize.me API requests through Nginx (logs in Portainer & bypasses CORS)
    location ~ ^/api/premiumize/(.*)$ {
        set $premiumize_url "https://www.premiumize.me/api/$1";
        proxy_pass $premiumize_url;
        proxy_set_header Host www.premiumize.me;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_name www.premiumize.me;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy Bitsearch API requests through Nginx (dynamic runtime DNS)
    location ~ ^/api/bitsearch/(.*)$ {
        set $bitsearch_url "https://bitsearch.to/api/$1";
        proxy_pass $bitsearch_url;
        proxy_set_header Host bitsearch.to;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_name bitsearch.to;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy Groq AI requests through Nginx (dynamic runtime DNS)
    location ~ ^/api/groq/(.*)$ {
        set $groq_url "https://api.groq.com/openai/v1/$1";
        proxy_pass $groq_url;
        proxy_set_header Host api.groq.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_name api.groq.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
