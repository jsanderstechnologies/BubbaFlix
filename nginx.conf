server {
    listen 5150;
    server_name localhost;

    # Configure Nginx logs
    access_log /var/log/nginx/access.log;
    access_log /dev/stdout;
    error_log /var/log/nginx/error.log warn;
    error_log /dev/stderr warn;

    # Resolvers for proxying upstream HTTPS hosts in Docker Nginx
    resolver 1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Primary Web Static SPA Route
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy ALL /api requests (settings, log, version, dispatcharr, transcode) to Node backend on port 5000
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Proxy SIMKL API requests through Nginx (logs in Portainer & bypasses CORS)
    location /api/simkl/ {
        proxy_pass https://api.simkl.com/;
        proxy_set_header Host api.simkl.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "BubbaFlix/1.0 (Smart TV Media App)";
        proxy_ssl_name api.simkl.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy Groq AI requests through Nginx (logs requests in Portainer & bypasses CORS)
    location /api/groq/ {
        proxy_pass https://api.groq.com/openai/v1/;
        proxy_set_header Host api.groq.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_name api.groq.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
