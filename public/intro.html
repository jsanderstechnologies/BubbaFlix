<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BubbaFlix Intro</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    background: radial-gradient(ellipse at center, #0a0000 0%, #000000 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  #grain {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    pointer-events: none;
    mix-blend-mode: overlay;
  }
  #glow {
    position: absolute;
    width: 60vmin;
    height: 60vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(229,9,20,0.55) 0%, rgba(229,9,20,0) 70%);
    opacity: 0;
    transform: scale(0.6);
    filter: blur(2px);
  }
  #logoWrap {
    position: relative;
    width: 46vmin;
    max-width: 640px;
    opacity: 0;
    transform: scale(0.25) rotate(-4deg);
  }
  #logoImg {
    display: block;
    width: 100%;
    filter: drop-shadow(0 0 0px rgba(229,9,20,0));
  }
  #shine {
    position: absolute;
    inset: 0;
    -webkit-mask-image: var(--mask-url);
    mask-image: var(--mask-url);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    background: linear-gradient(115deg,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0.9) 50%,
      rgba(255,255,255,0) 60%);
    background-size: 300% 100%;
    background-position: 150% 0;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #playBtn {
    position: absolute;
    z-index: 5;
    padding: 14px 28px;
    background: transparent;
    border: 1.5px solid #E50914;
    color: #fff;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  #playBtn:hover {
    background: rgba(229,9,20,0.15);
    box-shadow: 0 0 24px rgba(229,9,20,0.35);
  }
  #caption {
    position: absolute;
    bottom: 8vh;
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
  }
</style>
</head>

  var caption = document.getElementById('caption');

  function createReverbImpulse(ctx, duration, decay) {
    var rate = ctx.sampleRate;
    var length = rate * duration;
    var impulse = ctx.createBuffer(2, length, rate);
    for (var c = 0; c < 2; c++) {
      var channel = impulse.getChannelData(c);
      for (var i = 0; i < length; i++) {
        channel[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  function playThump(ctx, dest, reverbSend, startTime, freq, duration, volume) {
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * 2.2, startTime);
    osc.frequency.exponentialRampToValueAtTime(freq, startTime + 0.12);

    var oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.0001, startTime);
    oscGain.gain.linearRampToValueAtTime(volume, startTime + 0.015);
    oscGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

    osc.connect(oscGain);
    oscGain.connect(dest);
    oscGain.connect(reverbSend);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);

    var bufferSize = ctx.sampleRate * 0.2;
    var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = noiseBuffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    var noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = freq * 5;
    noiseFilter.Q.value = 0.7;
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(volume * 0.6, startTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.09);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(dest);
    noiseGain.connect(reverbSend);
    noise.start(startTime);
  }

  function playIntroSound(ctx) {
    var master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    var reverbGain = ctx.createGain();
    reverbGain.gain.value = 0.35;
    var convolver = ctx.createConvolver();
    convolver.buffer = createReverbImpulse(ctx, 2.2, 2.5);
    reverbGain.connect(convolver);
    convolver.connect(master);

    var now = ctx.currentTime;
    playThump(ctx, master, reverbGain, now + 0.05, 90, 0.8, 0.7);
    playThump(ctx, master, reverbGain, now + 0.95, 62, 1.6, 0.95);
  }

  function runAnimation() {
    var start = performance.now();
    var duration = 3200;

    function ease(t, p) { return 1 - Math.pow(1 - t, p); }

    function frame(now) {
      var t = now - start;

      if (t < 900) {
        var p = Math.min(t / 900, 1);
        var e = ease(p, 2.2);
        var scale = 0.25 + e * 0.58;
        var rot = -4 + e * 4;
        logoWrap.style.opacity = Math.min(p * 1.6, 1);
        logoWrap.style.transform = 'scale(' + scale + ') rotate(' + rot + 'deg)';
        glow.style.opacity = e * 0.5;
        glow.style.transform = 'scale(' + (0.6 + e * 0.5) + ')';
      } else if (t < 1300) {
        var p2 = (t - 900) / 400;
        var bounce = 0.83 + Math.sin(p2 * Math.PI) * 0.14;
        logoWrap.style.opacity = 1;
        logoWrap.style.transform = 'scale(' + bounce + ') rotate(0deg)';
        glow.style.opacity = 0.5 + Math.sin(p2 * Math.PI) * 0.4;
        glow.style.transform = 'scale(' + (1.1 + Math.sin(p2 * Math.PI) * 0.25) + ')';
        if (p2 < 0.15) {
          flash.style.opacity = (0.15 - p2) * 3;
        } else {
          flash.style.opacity = 0;
        }
      } else if (t < 2600) {
        var p3 = (t - 1300) / 1300;
        logoWrap.style.opacity = 1;
        logoWrap.style.transform = 'scale(1) rotate(0deg)';
        glow.style.opacity = Math.max(0.5 - p3 * 0.35, 0.15);
        glow.style.transform = 'scale(1.05)';
        shine.style.backgroundPosition = (150 - p3 * 300) + '% 0';
        caption.style.opacity = Math.min(p3 * 2, 1);
      } else {
        logoWrap.style.opacity = 1;
        glow.style.opacity = 0.15;
        caption.style.opacity = 1;
      }

      if (t < duration) {
        requestAnimationFrame(frame);
      }
    }
    requestAnimationFrame(frame);
  }

  playBtn.addEventListener('click', function() {
    playBtn.style.display = 'none';
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var ctx = new AudioCtx();
    if (ctx.state === 'suspended') { ctx.resume(); }
    playIntroSound(ctx);
    runAnimation();
  });
})();
</script>
</body>
