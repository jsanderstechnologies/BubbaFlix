version: '3.8'

services:
  # Production Service (Nginx + Express Server + FFmpeg Transcoder)
  bubbaflix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_APP_TMDB_KEY=${VITE_APP_TMDB_KEY:-}
    container_name: bubbaflix-app
    image: ghcr.io/jsanderstechnologies/bubbaflix:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - SIMKL_ACCESS_TOKEN=${SIMKL_ACCESS_TOKEN:-}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN:-}
      - BITSEARCH_API_KEY=${BITSEARCH_API_KEY:-}
    volumes:
      - bubbaflix-data:/app/server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/transcode/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "org.opencontainers.image.title=BubbaFlix"
      - "org.opencontainers.image.description=Movie and TV Show Streaming App"
      - "org.opencontainers.image.url=https://github.com/jsanderstechnologies/BubbaFlix"

  # Optional Development Service with Live Reload (Use: docker compose --profile dev up)
  bubbaflix-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bubbaflix-dev-app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  bubbaflix-data:
