version: '3.8'

services:
  bubbaflix:
    image: ghcr.io/jsanderstechnologies/bubbaflix:latest
    container_name: bubbaflix
    restart: unless-stopped
    ports:
      - "${PORT:-5150}:80"
      - "5151:5151/udp"
    labels:
      - "io.casaos.icon=https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix/master/public/tv_banner.png"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix/master/public/tv_banner.png"
      - "com.docker.desktop.extension.icon=https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix/master/public/tv_banner.png"
    environment:
      AIOSTREAMS_URL: "${AIOSTREAMS_URL:-https://aiostreams.elfhosted.com/}"
      SIMKL_CLIENT_ID: "${SIMKL_CLIENT_ID:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      TMDB_READ_ACCESS_TOKEN: "${TMDB_READ_ACCESS_TOKEN:-}"
      DISPATCHARR_URL: "${DISPATCHARR_URL:-http://192.168.1.100:9191}"
      DISPATCHARR_API_KEY: "${DISPATCHARR_API_KEY:-}"
    volumes:
      - bubbaflix-data:/app/server

volumes:
  bubbaflix-data:
    driver: local
