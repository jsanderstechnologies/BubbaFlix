version: '3.8'

services:
  bubbaflix:
    image: ghcr.io/jsanderstechnologies/bubbaflix:latest
    container_name: bubbaflix
    restart: unless-stopped
    ports:
      - "${PORT:-5150}:80"
    environment:
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN:-}
      - BITSEARCH_API_KEY=${BITSEARCH_API_KEY:-}
    volumes:
      - bubbaflix-data:/app/server

volumes:
  bubbaflix-data:
    driver: local
