version: '3.8'

services:
  bubbaflix:
    image: ghcr.io/jsanderstechnologies/bubbaflix:latest
    container_name: bubbaflix
    restart: unless-stopped
    ports:
      - "${PORT:-5150}:80"
    labels:
      - "io.casaos.icon=https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix/master/public/icon.svg"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix/master/public/icon.svg"
      - "com.docker.desktop.extension.icon=https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix/master/public/icon.svg"
    environment:
      - AIOSTREAMS_URL=${AIOSTREAMS_URL:-https://aiostreams.elfhosted.com/}
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN:-}
    volumes:
      - bubbaflix-data:/app/server

volumes:
  bubbaflix-data:
    driver: local
