name: Build Android TV APK

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'android-tv/**'
      - 'version.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./android-tv/gradlew

      - name: Build Release APK
        working-directory: ./android-tv
        run: ./gradlew assembleRelease -x lint

      - name: Move APK to Root
        run: |
          APK_PATH=$(find android-tv/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" BubbaFlixTV.apk

      - name: Commit and Push new APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile updated BubbaFlixTV.apk"
          file_pattern: "BubbaFlixTV.apk"
