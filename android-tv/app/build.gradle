plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jsanderstechnologies.bubbaflix'
    compileSdk 34

    defaultConfig {
        applicationId "com.jsanderstechnologies.bubbaflix"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "BubbaFlixTV.apk"
        }
    }

    signingConfigs {
        release {
            storeFile file('bubbaflix.jks')
            storePassword 'bubbaflix123'
            keyAlias 'bubbaflix'
            keyPassword 'bubbaflix123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.leanback:leanback:1.0.0'

    // AndroidX Media3 (ExoPlayer) for Universal Video & Audio Codec Support (MKV, AC3, EAC3, TrueHD, DTS, HEVC, HLS)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.1'
    implementation 'androidx.media3:media3-extractor:1.2.1'

    // OkHttp for streaming network requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Glide for TMDB Logo image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
